name: Daily Quant Screener & Paper Trader

on:
  schedule:
    # Runs at 11:30 UTC (5:00 PM IST) Monday through Friday
    - cron: '30 11 * * 1-5'
  workflow_dispatch: # Allows manual trigger from the GitHub UI

concurrency:
  group: quant-pipeline
  # Queues manual runs instead of killing an in-progress scheduled run
  cancel-in-progress: false 

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    
    # Dynamic timeout: 45 mins for the daily cron, 330 mins for a manual rebuild
    timeout-minutes: ${{ github.event_name == 'schedule' && 45 || 330 }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # Persist the parquet files across runs so data_fetcher.py only fetches incremental data
      - name: Restore/Save OHLCV Cache
        uses: actions/cache@v4
        with:
          path: data/ohlcv_cache
          key: ohlcv-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ohlcv-cache-${{ runner.os }}-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Step 1 - Fetch Market Data
        run: python src/data_fetcher.py

      - name: Step 2 - Run Screener
        run: python src/screener.py

      - name: Step 3 - Execute Paper Trades
        run: python src/paper_trader.py

      - name: Commit and Push Updates
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Stage the screener results
          git add data/latest_screener_results.json
          
          # Stage the paper trades ledger safely (in case it hasn't been created yet)
          if [ -f data/paper_trades.json ]; then
            git add data/paper_trades.json
          fi
          
          # Only commit and push if the data actually changed (avoids empty holiday commits)
          git diff-index --quiet HEAD || (git commit -m "Automated daily scan and paper portfolio update" && git push)
