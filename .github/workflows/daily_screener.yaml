name: Daily Nifty Quant Screener

on:
  schedule:
    - cron: '30 10 * * 1-5' # Runs Monday to Friday at 10:30 UTC (4:00 PM IST)
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

permissions:
  contents: write

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Quantitative Screener
        run: |
          python src/screener.py

      - name: Commit and Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git status
          git add data/latest_screener_results.json
          git diff --staged --quiet || git commit -m "Automated daily scan update: $(date +'%Y-%m-%d')"
          git push