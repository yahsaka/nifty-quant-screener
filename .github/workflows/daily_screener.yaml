name: Daily Nifty Quant Screener

on:
  schedule:
    - cron: "30 11 * * 1-5" # 5:00 PM IST, after the regular NSE close and data settlement
  workflow_dispatch:

permissions:
  contents: write
# random
# A manual run must not race a scheduled run and overwrite its results/cache.
concurrency:
  group: daily-nifty-quant-screener
  cancel-in-progress: false

jobs:
  run-screener:
    runs-on: ubuntu-latest
    
    # Dynamic timeout: 45 mins for scheduled runs, 330 mins for manual full rebuilds
    timeout-minutes: ${{ github.event_name == 'schedule' && 45 || 330 }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore OHLCV cache
        uses: actions/cache@v4
        with:
          path: data/ohlcv_cache
          key: ${{ runner.os }}-nifty-ohlcv-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-nifty-ohlcv-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Refresh market data
        run: python src/data_fetcher.py

      - name: Verify complete cache
        run: |
          expected=$(python -c "import pandas as pd; print(len(pd.read_csv('data/nifty500_tickers.csv')['Symbol'].dropna().unique()))")
          cached=$(find data/ohlcv_cache -maxdepth 1 -name '*.parquet' -type f | wc -l)
          echo "Expected $expected ticker files; found $cached cached files."
          test "$cached" -ge "$expected"

      - name: Run quantitative screener
        run: python src/screener.py

      - name: Verify screener output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          output = Path("data/latest_screener_results.json")
          if not output.exists():
              raise SystemExit("Screener did not produce a results file.")
          result = json.loads(output.read_text(encoding="utf-8"))
          if result.get("market_regime") not in {"Bullish", "Bearish", "Unknown"}:
              raise SystemExit("Unexpected market regime in screener output.")
          if result.get("total_scanned") != result.get("universe_size"):
              raise SystemExit("Screener did not evaluate the complete cached universe.")
          if result.get("failed_count", 0):
              raise SystemExit("Screener reported failed ticker evaluations.")
          PY

      - name: Execute Paper Trades
        run: python src/paper_trader.py

      - name: Commit and push results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add data/latest_screener_results.json
          
          # Stage the paper trades ledger if it exists
          if [ -f data/paper_trades.json ]; then
            git add data/paper_trades.json
          fi
          
          # The current NSE constituent list is intentionally retained as the
          # offline fallback, even though broker CSV uploads are ignored.
          git add -f data/nifty500_tickers.csv
          
          git diff --staged --quiet || git commit -m "Automated daily scan update: $(date +'%Y-%m-%d')"
          git push
